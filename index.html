<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Grand Mobile Qoidalari 🎮</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050a05;
            --card-bg: rgba(10, 20, 10, 0.9);
            --card-border: rgba(74, 222, 128, 0.2);
            --primary: #22c55e;
            --primary-gradient: linear-gradient(135deg, #166534 0%, #22c55e 100%);
            --accent: #bef264;
            --text-main: #f0fdf4;
            --text-muted: #86efac;
            --danger: #ef4444;
            --success: #22c55e;
            --glow: rgba(34, 197, 94, 0.25);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; padding-bottom: 90px; }

        .app-header { padding: 16px; display: flex; justify-content: space-between; align-items: center; background: rgba(5, 10, 5, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--primary); }
        .user-avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--primary-gradient); display: flex; align-items: center; justify-content: center; font-weight: 700; color: #000; box-shadow: 0 0 15px var(--glow); }

        .search-container { padding: 12px 16px; }
        .search-box { background: var(--card-bg); border: 1px solid var(--primary); border-radius: 14px; display: flex; align-items: center; padding: 0 14px; height: 46px; }
        .search-input { width: 100%; background: transparent; border: none; color: var(--text-main); outline: none; }

        .cat-chip { background: var(--card-bg); border: 1px solid var(--primary); padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--text-muted); }
        .cat-chip.active { background: var(--primary-gradient); color: #000; }

        .rule-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 16px; margin: 10px 16px; transition: 0.3s; }
        .rule-code { font-family: 'Rajdhani', sans-serif; font-size: 14px; font-weight: 700; color: var(--primary); margin-bottom: 8px; display: block; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(5, 10, 5, 0.95); border-top: 1px solid var(--primary); display: flex; justify-content: space-around; padding: 10px; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 11px; }
        .nav-item.active { color: var(--primary); }
    </style>
</head>
<body>
    <header class="app-header">
        <div class="user-greeting">
            <div class="user-avatar" id="userAvatar">GM</div>
            <div class="user-info">
                <h2 id="userName">Grand Mobile</h2>
                <p>Yashil Qoidalar</p>
            </div>
        </div>
    </header>

    <div class="search-container">
        <div class="search-box"><span>🔍</span><input type="text" id="searchInput" class="search-input" placeholder="Qidirish..."></div>
    </div>

    <div id="rulesList" class="rules-list"></div>

    <nav class="bottom-nav">
        <button class="nav-item active"><span style="font-size: 20px;">📜</span>Qoidalar</button>
        <button class="nav-item"><span style="font-size: 20px;">ℹ️</span>Info</button>
    </nav>

    <script>
        const rulesData = [
            { id: "1.1", code: "1.1", title: "Umumiy qoidalar", desc: "Har bir o'yinchi qoidalarni bilishi shart." },
            { id: "2.1", code: "2.1", title: "Chat qoidalari", desc: "Haqorat qilish taqiqlanadi." }
        ];

        function render() {
            const list = document.getElementById('rulesList');
            list.innerHTML = rulesData.map(r => `
                <div class="rule-card">
                    <span class="rule-code">${r.code}</span>
                    <h4 style="color:var(--text-main); margin-bottom:5px;">${r.title}</h4>
                    <p class="rule-desc">${r.desc}</p>
                </div>
            `).join('');
        }
        render();
    </script>
</body>
</html>
