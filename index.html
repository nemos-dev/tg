<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Grand Mobile Rules 🎮</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050a05;
            --card-bg: rgba(10, 20, 10, 0.9);
            --card-border: rgba(34, 197, 94, 0.3);
            --primary: #22c55e;
            --primary-gradient: linear-gradient(135deg, #166534 0%, #22c55e 100%);
            --accent: #bef264;
            --text-main: #f0fdf4;
            --text-muted: #86efac;
            --danger: #ef4444;
            --glow: rgba(34, 197, 94, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Montserrat', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; padding-bottom: 90px; overflow-x: hidden; }

        /* HEADER */
        .app-header { padding: 16px; display: flex; justify-content: space-between; align-items: center; background: rgba(5, 10, 5, 0.95); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--primary); }
        .user-greeting { display: flex; align-items: center; gap: 12px; }
        .user-avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--primary-gradient); display: flex; align-items: center; justify-content: center; font-weight: 700; color: #000; box-shadow: 0 0 15px var(--glow); }
        .header-actions { display: flex; gap: 8px; }
        .icon-btn { background: var(--card-bg); border: 1px solid var(--primary); padding: 8px 12px; border-radius: 12px; color: var(--primary); cursor: pointer; font-size: 13px; font-weight: 700; }

        /* SEARCH */
        .search-container { padding: 12px 16px; }
        .search-box { background: var(--card-bg); border: 1px solid var(--primary); border-radius: 14px; display: flex; align-items: center; padding: 0 14px; height: 48px; box-shadow: 0 0 15px var(--glow); }
        .search-input { width: 100%; background: transparent; border: none; color: var(--text-main); font-size: 14px; outline: none; padding-left: 10px; }

        /* CATEGORIES */
        .categories-scroll { display: flex; gap: 8px; padding: 4px 16px 12px; overflow-x: auto; scrollbar-width: none; }
        .cat-chip { background: var(--card-bg); border: 1px solid var(--card-border); padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: 600; white-space: nowrap; cursor: pointer; color: var(--text-muted); }
        .cat-chip.active { background: var(--primary-gradient); color: #000; border-color: transparent; }

        /* RULES LIST */
        .rules-list { padding: 0 16px; display: flex; flex-direction: column; gap: 12px; }
        .rule-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 16px; position: relative; transition: transform 0.2s; cursor: pointer; }
        .rule-card:active { transform: scale(0.98); }
        .rule-code { font-family: 'Rajdhani', sans-serif; font-size: 16px; font-weight: 700; color: var(--primary); display: block; margin-bottom: 4px; }
        .rule-title { font-size: 15px; font-weight: 700; margin-bottom: 6px; color: #fff; }
        .rule-desc { font-size: 13px; color: var(--text-muted); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        /* MODAL */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); z-index: 1000; display: flex; justify-content: center; align-items: flex-end; opacity: 0; visibility: hidden; transition: all 0.3s ease; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-sheet { background: #0a140a; border-top: 2px solid var(--primary); border-radius: 24px 24px 0 0; width: 100%; max-height: 85vh; overflow-y: auto; padding: 24px; transform: translateY(100%); transition: transform 0.35s ease; }
        .modal-overlay.active .modal-sheet { transform: translateY(0); }
        .modal-title { font-size: 20px; font-weight: 800; color: var(--primary); margin-bottom: 12px; font-family: 'Rajdhani', sans-serif; }
        .modal-body { font-size: 15px; line-height: 1.6; color: #f0fdf4; }
        .punishment-box { background: rgba(239, 68, 68, 0.1); border-left: 4px solid var(--danger); padding: 12px; margin-top: 15px; border-radius: 4px; color: #fca5a5; font-size: 14px; font-weight: 600; }

        /* NAV */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(5, 10, 5, 0.98); border-top: 1px solid var(--primary); display: flex; justify-content: space-around; padding: 12px; z-index: 100; }
        .nav-item { background: none; border: none; color: var(--text-muted); display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; }
        .nav-item.active { color: var(--primary); }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="user-greeting">
            <div class="user-avatar" id="userAvatar">GM</div>
            <div class="user-info">
                <h2 id="userName">O'yinchi</h2>
                <p id="subGreeting">Qoidalar / Правила</p>
            </div>
        </div>
        <div class="header-actions">
            <button class="icon-btn" id="langBtn" onclick="toggleLanguage()">🇺🇿 UZ</button>
        </div>
    </header>

    <div class="search-container">
        <div class="search-box">
            <span>🔍</span>
            <input type="text" id="searchInput" class="search-input" placeholder="Izlash / Поиск..." oninput="filterRules()">
        </div>
    </div>

    <div class="categories-scroll" id="categoriesScroll">
        <div class="cat-chip active" data-cat="all" onclick="switchCategory('all')">Barchasi / Все</div>
        <div class="cat-chip" data-cat="1" onclick="switchCategory('1')">I. Umumiy / Общие</div>
        <div class="cat-chip" data-cat="2" onclick="switchCategory('2')">II. Chat / Чат</div>
        <div class="cat-chip" data-cat="3" onclick="switchCategory('3')">III. Admin</div>
        <div class="cat-chip" data-cat="4" onclick="switchCategory('4')">IV. Akkaunt / Аккаунт</div>
        <div class="cat-chip" data-cat="5" onclick="switchCategory('5')">V. Gameplay</div>
    </div>

    <div class="rules-list" id="rulesList"></div>

    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchCategory('all')"><span>📜</span><span id="navRules">Qoidalar</span></button>
        <button class="nav-item" onclick="showInfo()"><span>ℹ️</span><span id="navInfo">Info</span></button>
    </nav>

    <div class="modal-overlay" id="ruleModal" onclick="closeModal(event)">
        <div class="modal-sheet" onclick="event.stopPropagation()">
            <div id="modalCode" class="rule-code"></div>
            <h2 id="modalTitle" class="modal-title"></h2>
            <div id="modalBody" class="modal-body"></div>
            <div id="modalPunishment" class="punishment-box"></div>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        let currentLang = 'uz';

        const rulesData = [
            // I. ОБЩИЕ ПОЛОЖЕНИЯ
            { id: "1.1", cat: "1", code: "1.1", title: {uz: "Qoidalarni qabul qilish", ru: "Принятие правил"}, desc: {uz: "Hisob yaratish orqali siz barcha qoidalarga rozilik bildirasiz.", ru: "Создавая аккаунт, вы принимаете правила серверов."}, pun: {uz: "Bilmaslik jazodan ozod qilmaydi.", ru: "Незнание правил не освобождает от ответственности."} },
            { id: "1.2", cat: "1", code: "1.2", title: {uz: "Ma'muriyat nomidan aldash", ru: "Ввод в заблуждение"}, desc: {uz: "O'zini admin yoki ishlab chiquvchi deb tanishtirish taqiqlanadi.", ru: "Запрещено представляться администрацией или разработчиками."}, pun: {uz: "Jazo: 3-7 kunlik blokdan butunlaygacha.", ru: "Наказание: блок от 3 дней до навсегда."} },
            { id: "1.3", cat: "1", code: "1.3", title: {uz: "Qoidalardagi bo'shliqlardan foydalanish", ru: "Обход правил"}, desc: {uz: "Qoidalardagi kamchiliklardan foydalanib jazo chetlab o'tish taqiqlanadi.", ru: "Запрещены попытки избежать наказания через пробелы в правилах."}, pun: {uz: "Jazo: 3-31 kunlik blok.", ru: "Наказание: блок от 3 до 31 дня."} },
            { id: "1.6", cat: "1", code: "1.6", title: {uz: "Nik-neym qoidalari", ru: "Никнеймы"}, desc: {uz: "Adminlar yoki taniqli shaxslarga o'xshash niklar taqiqlanadi.", ru: "Запрещены никнеймы, схожие с администрацией/медиа."}, pun: {uz: "Jazo: Blok 31 kungacha.", ru: "Наказание: блок до 31 дня."} },

            // II. ПРАВИЛА ОБЩЕНИЯ
            { id: "2.1", cat: "2", code: "2.1", title: {uz: "Haqoratlar", ru: "Оскорбления"}, desc: {uz: "O'yinchini yoki uning yaqinlarini haqorat qilish taqiqlanadi.", ru: "Запрещено оскорбление личности игрока и его родственников."}, pun: {uz: "Ota-ona uchun: 3-10 kunlik blok / 180 min mute.", ru: "За родных: блок 3-10 дней / 180 мин мут."} },
            { id: "2.2", cat: "2", code: "2.2", title: {uz: "Taqiqlangan targ'ibotlar", ru: "Запрещенная пропаганда"}, desc: {uz: "Narkotik, porno, ekstremizm va suitsid targ'iboti taqiqlanadi.", ru: "Запрещена пропаганда наркотиков, порнографии, экстремизма."}, pun: {uz: "Jazo: 3 kundan butunlay blokkacha.", ru: "Наказание: блок от 3 дней до навсегда."} },
            { id: "2.3", cat: "2", code: "2.3", title: {uz: "Reklama", ru: "Реклама"}, desc: {uz: "Boshqa sayt yoki ijtimoiy tarmoqlarni reklama qilish taqiqlanadi.", ru: "Запрещена любая реклама сторонних ресурсов."}, pun: {uz: "Jazo: 60-120 min mute / Butunlay blok.", ru: "Наказание: мут 60-120 мин / Пермач."} },
            { id: "2.4", cat: "2", code: "2.4", title: {uz: "Irqchilik va Siyosat", ru: "Расизм и Политика"}, desc: {uz: "Din, irq va siyosatni muhokama qilish taqiqlanadi.", ru: "Запрещены расизм, ксенофобия и обсуждение политики."}, pun: {uz: "Jazo: 60-180 min mute / 1-31 kun blok.", ru: "Наказание: мут 60-180 мин / 1-31 день блок."} },

            // III. ВЗАИМОДЕЙСТВИЕ С АДМИНИСТРАЦИЕЙ
            { id: "3.1", cat: "3", code: "3.1", title: {uz: "Reportdan noto'g'ri foydalanish", ru: "Злоупотребление репортом"}, desc: {uz: "Reportga off-top yoki pul so'rab yozish taqiqlanadi.", ru: "Запрещен оффтоп и флуд в репорт."}, pun: {uz: "Jazo: 30 min mute report.", ru: "Наказание: мут репорта до 30 мин."} },
            { id: "3.2", cat: "3", code: "3.2", title: {uz: "Adminga nisbatan qo'polik", ru: "Хамство администрации"}, desc: {uz: "Adminlarni aldash yoki haqorat qilish taqiqlanadi.", ru: "Запрещены хамство, клевета и обман в отношении администрации."}, pun: {uz: "Jazo: 3-31 kunlik blok.", ru: "Наказание: блок от 3 до 31 дня."} },

            // IV. АККАУНТЫ И ИМУЩЕСТВО
            { id: "4.1", cat: "4", code: "4.1", title: {uz: "Valyuta mahinatsiyasi", ru: "Махинации"}, desc: {uz: "Akkaunt sotish, sotib olish va valyuta bilan firibgarlik taqiqlanadi.", ru: "Запрещены любые махинации с игровой валютой и продажа аккаунтов."}, pun: {uz: "Jazo: 31 kundan butunlay blokkacha.", ru: "Наказание: блок от 31 дня до навсегда."} },
            { id: "4.4", cat: "4", code: "4.4", title: {uz: "Real pulga savdo", ru: "Продажа за реал"}, desc: {uz: "Mulkni real pulga sotish yoki sotib olish taqiqlanadi.", ru: "Запрещены сделки за реальные деньги."}, pun: {uz: "Jazo: Butunlay blok + mulkni nol qilish.", ru: "Наказание: Пермач + обнуление."} },
            { id: "4.5", cat: "4", code: "4.5", title: {uz: "Sovg'a limiti", ru: "Лимит подарка"}, desc: {uz: "Kuniga 30,000,000 rubldan ortiq sovg'a berish taqiqlanadi.", ru: "Запрещена передача имущества свыше 30.000.000 руб в сутки."}, pun: {uz: "Jazo: 31 kun blok + mulkni nol qilish.", ru: "Наказание: блок до 31 дня + обнуление."} },

            // V. ИГРОВОЙ ПРОЦЕСС
            { id: "5.2", cat: "5", code: "5.2", title: {uz: "Cheatlar va Boglar", ru: "Читы и Баги"}, desc: {uz: "Yordamchi dasturlar va boglardan foydalanish taqiqlanadi.", ru: "Запрещено использование ПО (читов) и багов игры."}, pun: {uz: "Cheat uchun: 7-31 kun blok. Bog uchun: Warn/3 kun blok.", ru: "Читы: 7-31 день блок. Багоюз: Warn/3 дня блок."} },
            { id: "5.3", cat: "5", code: "5.3", title: {uz: "RP dan qochish", ru: "Уход от RP"}, desc: {uz: "O'yindan chiqib ketish yoki AFK orqali RP dan qochish taqiqlanadi.", ru: "Запрещено покидать RP-ситуацию через выход из игры или AFK."}, pun: {uz: "Jazo: 60 min Demorgan.", ru: "Наказание: деморган 60 мин."} },
            { id: "5.4", cat: "5", code: "5.4", title: {uz: "Uy hududida DM", ru: "DM у дома"}, desc: {uz: "Uy yoki kvartira kirish qismida o'ldirish taqiqlanadi.", ru: "Запрещено убийство у входа в дом или квартиру."}, pun: {uz: "Jazo: 120 min Demorgan.", ru: "Наказание: деморган 120 мин."} },
            { id: "5.6", cat: "5", code: "5.6", title: {uz: "Amoral harakatlar", ru: "Аморальные действия"}, desc: {uz: "Inson qadr-qimmatini kamsituvchi harakatlar taqiqlanadi.", ru: "Запрещены действия, унижающие достоинство (домогательства)."}, pun: {uz: "Jazo: 7 kungacha blok.", ru: "Наказание: блок до 7 дней."} }
        ];

        function renderRules(cat = 'all', query = '') {
            const list = document.getElementById('rulesList');
            const q = query.toLowerCase();
            let filtered = cat === 'all' ? rulesData : rulesData.filter(r => r.cat === cat);

            if (q) {
                filtered = filtered.filter(r =>
                    r.title[currentLang].toLowerCase().includes(q) ||
                    r.code.toLowerCase().includes(q) ||
                    r.desc[currentLang].toLowerCase().includes(q)
                );
            }

            list.innerHTML = filtered.map(r => `
                <div class="rule-card" onclick="openRule('${r.id}')">
                    <span class="rule-code">${r.code}</span>
                    <h4 class="rule-title">${r.title[currentLang]}</h4>
                    <p class="rule-desc">${r.desc[currentLang]}</p>
                </div>
            `).join('');

            document.querySelectorAll('.cat-chip').forEach(c => {
                c.classList.toggle('active', c.dataset.cat === cat);
            });
        }

        function toggleLanguage() {
            currentLang = currentLang === 'uz' ? 'ru' : 'uz';
            document.getElementById('langBtn').innerText = currentLang === 'uz' ? '🇺🇿 UZ' : '🇷🇺 RU';
            document.getElementById('navRules').innerText = currentLang === 'uz' ? 'Qoidalar' : 'Правила';
            document.getElementById('navInfo').innerText = currentLang === 'uz' ? 'Info' : 'Инфо';
            renderRules(currentCategory);
        }

        let currentCategory = 'all';
        function switchCategory(cat) {
            currentCategory = cat;
            renderRules(cat, document.getElementById('searchInput').value);
        }

        function filterRules() {
            renderRules(currentCategory, document.getElementById('searchInput').value);
        }

        function openRule(id) {
            const r = rulesData.find(x => x.id === id);
            document.getElementById('modalCode').innerText = r.code;
            document.getElementById('modalTitle').innerText = r.title[currentLang];
            document.getElementById('modalBody').innerText = r.desc[currentLang];
            document.getElementById('modalPunishment').innerText = (currentLang === 'uz' ? "JAZO: " : "НАКАЗАНИЕ: ") + r.pun[currentLang];
            document.getElementById('ruleModal').classList.add('active');
            if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
        }

        function closeModal(e) {
            document.getElementById('ruleModal').classList.remove('active');
        }

        function showInfo() {
            alert(currentLang === 'uz' ? "Grand Mobile Rules v1.2\nBarcha qoidalar I-V bo'limlari kiritildi." : "Grand Mobile Rules v1.2\nВведены все правила разделов I-V.");
        }

        const user = tg.initDataUnsafe && tg.initDataUnsafe.user;
        if (user) {
            document.getElementById('userName').innerText = user.first_name;
            document.getElementById('userAvatar').innerText = user.first_name.substring(0, 2).toUpperCase();
        }

        renderRules();
    </script>
</body>
</html>
